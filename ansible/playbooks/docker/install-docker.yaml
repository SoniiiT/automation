- name: Install Docker
  hosts: all
  become: true

  tasks:
    - name: Check if Docker is installed
      command: docker --version
      register: docker_check
      ignore_errors: true
      changed_when: false

    # --- Debian / Ubuntu Family ---
    - name: Install prerequisites (Debian/Ubuntu)
      apt:
        pkg:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
      when: docker_check.rc != 0 and ansible_os_family == 'Debian'

    - name: Create directory for apt keyrings (Debian/Ubuntu)
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: docker_check.rc != 0 and ansible_os_family == 'Debian'

    - name: Download Docker's official GPG key (Debian/Ubuntu)
      get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: 'a+r'
      when: docker_check.rc != 0 and ansible_os_family == 'Debian'

    - name: Add Docker repository to Apt sources (Debian/Ubuntu)
      copy:
        dest: /etc/apt/sources.list.d/docker.sources
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/{{ ansible_distribution | lower }}
          Suites: {{ ansible_distribution_release }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: docker_check.rc != 0 and ansible_os_family == 'Debian'

    - name: Update apt cache (Debian/Ubuntu)
      apt:
        update_cache: true
      when: docker_check.rc != 0 and ansible_os_family == 'Debian'

    - name: Install Docker packages (Debian/Ubuntu)
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
      when: docker_check.rc != 0 and ansible_os_family == 'Debian'

    # --- RedHat / CentOS / Fedora Family ---
    - name: Install prerequisites (RedHat/CentOS/Fedora)
      dnf:
        name: dnf-plugins-core
        state: present
      when: docker_check.rc != 0 and ansible_os_family == 'RedHat'

    - name: Add Docker repository (RedHat/CentOS/Fedora)
      get_url:
        url: "https://download.docker.com/linux/{{ 'rhel' if ansible_distribution == 'RedHat' else (ansible_distribution | lower) }}/docker-ce.repo"
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'
      when: docker_check.rc != 0 and ansible_os_family == 'RedHat'

    - name: Install Docker packages (RedHat/CentOS/Fedora)
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
      when: docker_check.rc != 0 and ansible_os_family == 'RedHat'

    - name: Start and enable Docker service (RedHat/CentOS/Fedora)
      systemd:
        name: docker
        state: started
        enabled: true
      when: docker_check.rc != 0 and ansible_os_family == 'RedHat'

    - name: Add User to Docker Group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when: ansible_user != 'root'

    - name: Create directory for Docker systemd override
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'

    - name: Configure Docker to listen on TCP port 2375
      copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/dockerd -H fd:// -H tcp://0.0.0.0:2375
        mode: '0644'
      notify: Reload Docker

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Reboot
      ansible.builtin.reboot:
        connect_timeout: 5
        msg: "Rebooting to apply all updates"
        in_minutes: 5
      when: docker_check.rc != 0

  handlers:
    - name: Reload Docker
      systemd:
        name: docker
        state: restarted
        daemon_reload: true