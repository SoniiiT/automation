- name: Update and upgrade apt packages
  hosts: all
  become: true

  tasks:
  - name: Update packages with apt
    when: ansible_pkg_mgr == 'apt'
    ansible.builtin.apt:
      update_cache: true

  - name: Upgrade packages with apt
    when: ansible_pkg_mgr == 'apt'
    ansible.builtin.apt:
      upgrade: dist

- name: Update and upgrade apt packages
  hosts: docker
  become: true

  tasks:
    - name: Update packages with apt
      when: ansible_pkg_mgr == 'apt'
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade packages with apt
      when: ansible_pkg_mgr == 'apt'
      ansible.builtin.apt:
        upgrade: dist

    - name: Install aptitude
      apt:
        name: aptitude
        state: latest
        update_cache: true

    - name: Install required system packages
      apt:
        pkg:
          - ca-certificates
          - curl
        state: latest
        update_cache: true

- name: Install Docker
  hosts: docker
  become: true

  tasks:
    - name: Download Docker installation script
      get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: '0755'

    - name: Run Docker installation script
      command: sh /tmp/get-docker.sh

    - name: Add User to Docker Group
      user:
        name: soniiit
        groups: docker
        append: true

    - name: Create directory for Docker systemd override
      file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: '0755'

    - name: Configure Docker to listen on TCP port 2375
      copy:
        dest: /etc/systemd/system/docker.service.d/override.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/dockerd -H fd:// -H tcp://0.0.0.0:2375
        mode: '0644'

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Reboot
      ansible.builtin.reboot:
        connect_timeout: 5
        msg: "Rebooting to apply all updates"
        in_minutes: 5