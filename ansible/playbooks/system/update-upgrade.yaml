- name: Update and upgrade apt packages
  hosts: all
  become: true
  # Required Semaphore Extra Variables:
  #   pushover_token  - Pushover application token
  #   pushover_user   - Pushover user key

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Count upgradable packages
      ansible.builtin.shell:
        cmd: apt-get -s upgrade 2>/dev/null | grep '^Inst' | wc -l
        executable: /bin/bash
      changed_when: false
      register: upgradable_count
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Get upgradable package names
      ansible.builtin.shell:
        cmd: apt-get -s upgrade 2>/dev/null | grep '^Inst' | awk '{print $2}' | paste -sd ','
        executable: /bin/bash
      changed_when: false
      register: upgradable_packages
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Save pending updates to temp file
      ansible.builtin.copy:
        content: |
          host={{ inventory_hostname }}
          count={{ upgradable_count.stdout | trim }}
          packages={{ upgradable_packages.stdout | trim }}
        dest: /tmp/ansible_pending_updates.txt
        mode: '0644'
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Set update facts
      ansible.builtin.set_fact:
        packages_pending: "{{ upgradable_count.stdout | trim | int }}"
        packages_list: "{{ upgradable_packages.stdout | trim }}"
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Upgrade packages with apt
      ansible.builtin.apt:
        upgrade: dist
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: Send Pushover update summary
      run_once: true
      delegate_to: localhost
      become: false
      vars:
        _date: "{{ lookup('pipe', 'date +\"%A, %-d. %B %Y\"') }}"
        _line: "{% macro host_line(h) %}{% if hostvars[h].packages_pending is defined %}{% if hostvars[h].packages_pending | int > 0 %}✅ {{ h }}: {{ hostvars[h].packages_pending }} Pakete aktualisiert{% else %}✅ {{ h }}: Alles aktuell{% endif %}{% endif %}{% endmacro %}"
        _proxmox: |
          🖥️ Proxmox
          {% for h in groups['proxmox_servers'] | default([]) %}{{ host_line(h) }}
          {% endfor %}
        _docker: |
          🐳 Docker
          {% for h in groups['docker_servers'] | default([]) | reject('in', groups['lxc_hosts'] | default([])) | list %}{{ host_line(h) }}
          {% endfor %}
        _app: |
          💻 App / AI
          {% for h in groups['application_servers'] | default([]) %}{{ host_line(h) }}
          {% endfor %}
        _lxc: |
          📦 LXC
          {% for h in groups['lxc_hosts'] | default([]) | reject('in', groups['github_agents'] | default([])) | list %}{{ host_line(h) }}
          {% endfor %}
        _runners: |
          🏃 GitHub Runners
          {% for h in groups['github_agents'] | default([]) %}{{ host_line(h) }}
          {% endfor %}
        _other: |
          🏠 Sonstiges
          {% for h in groups['vm_hosts'] | default([]) | reject('in', (groups['docker_servers'] | default([])) + (groups['application_servers'] | default([]))) | list %}{{ host_line(h) }}
          {% endfor %}
      ansible.builtin.uri:
        url: "https://api.pushover.net/1/messages.json"
        method: POST
        body_format: form-urlencoded
        body:
          token: "{{ pushover_token }}"
          user: "{{ pushover_user }}"
          title: "✅ Update-Report: {{ _date }}"
          message: "{{ (_proxmox + _docker + _app + _lxc + _runners + _other) | trim | truncate(1024, false, '...') }}"
        status_code: 200