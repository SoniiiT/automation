---
- name: Einrichten der Longhorn-Voraussetzungen
  hosts: k3s_cluster
  become: true

  tasks:
    - name: iSCSI-Modul laden
      ansible.builtin.modprobe:
        name: iscsi_tcp
        state: present

    - name: iSCSI-Dienst starten und aktivieren
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: yes

    - name: NFS-Common installieren
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: yes
      when: ansible_pkg_mgr == 'apt'

    - name: Multipath-Dienste deaktivieren
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - multipathd
        - multipathd.socket
